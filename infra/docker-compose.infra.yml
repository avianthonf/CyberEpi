version: "3.9"

# CyberEpi infrastructure stack with proper Kafka dual-listener configuration:
# - INTERNAL listener on 9092 (standard port all services expect for kafka:9092)
# - EXTERNAL listener on 29092 (for host access via localhost:29092)
# - Includes monitoring exporters and observability stack

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *common
    image: timescale/timescaledb:latest-pg16
    container_name: cyberepi-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cyberepi
      POSTGRES_USER: cyberepi
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberepi -d cyberepi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      cyberepi-net:
        aliases:
          - postgres
          - cyberepi-postgres

  postgres-exporter:
    <<: *common
    image: prometheuscommunity/postgres-exporter:latest
    container_name: cyberepi-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://cyberepi:devpassword@postgres:5432/cyberepi?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cyberepi-net

  redis:
    <<: *common
    image: redis:7-alpine
    container_name: cyberepi-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      cyberepi-net:
        aliases:
          - redis
          - cyberepi-redis

  redis-exporter:
    <<: *common
    image: oliver006/redis_exporter:latest
    container_name: cyberepi-redis-exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cyberepi-net

  zookeeper:
    <<: *common
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: cyberepi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc 127.0.0.1 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      cyberepi-net:
        aliases:
          - zookeeper
          - cyberepi-zookeeper

  kafka:
    <<: *common
    image: confluentinc/cp-kafka:7.6.0
    container_name: cyberepi-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # INTERNAL listener on 9092 (all container configs use kafka:9092)
      # EXTERNAL listener on 29092 (host access via localhost:29092)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      cyberepi-net:
        aliases:
          - kafka
          - cyberepi-kafka

  kafka-exporter:
    <<: *common
    image: danielqsj/kafka-exporter:latest
    container_name: cyberepi-kafka-exporter
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - cyberepi-net

  schema-registry:
    <<: *common
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: cyberepi-schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      cyberepi-net:
        aliases:
          - schema-registry
          - cyberepi-schema-registry

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cyberepi-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for Kafka to be fully ready...' &&
        cub kafka-ready -b kafka:9092 1 120 &&
        echo 'Creating topics...' &&
        kafka-topics --create --topic patient.events --partitions 6 --replication-factor 1 --bootstrap-server kafka:9092 --if-not-exists &&
        kafka-topics --create --topic epi.updates --partitions 3 --replication-factor 1 --bootstrap-server kafka:9092 --if-not-exists &&
        kafka-topics --create --topic alerts.push --partitions 3 --replication-factor 1 --bootstrap-server kafka:9092 --if-not-exists &&
        echo 'Topics created successfully!'
      "
    networks:
      - cyberepi-net

  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:24.0
    container_name: cyberepi-keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: cyberepi
      KC_DB_PASSWORD: devpassword
    command: start-dev --import-realm
    volumes:
      - ./keycloak-realms:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      cyberepi-net:
        aliases:
          - keycloak
          - cyberepi-keycloak

  # Monitoring Stack
  prometheus:
    <<: *common
    image: prom/prometheus:latest
    container_name: cyberepi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - cyberepi-net

  loki:
    <<: *common
    image: grafana/loki:latest
    container_name: cyberepi-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - cyberepi-net

  promtail:
    <<: *common
    image: grafana/promtail:latest
    container_name: cyberepi-promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log
      - ../logs:/cyberepi/logs
    command: -config.file=/etc/promtail/config.yml
    networks:
      - cyberepi-net

  grafana:
    <<: *common
    image: grafana/grafana:latest
    container_name: cyberepi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - cyberepi-net

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  cyberepi-net:
    driver: bridge
    name: cyberepi-net
