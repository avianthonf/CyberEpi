global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "kong"
    scrape_interval: 10s
    static_configs:
      - targets: ["kong:8001"]
    metrics_path: /metrics

  - job_name: "user-service"
    scrape_interval: 10s
    static_configs:
      - targets: ["user-service:8001"]
    metrics_path: /metrics

  - job_name: "symptom-service"
    scrape_interval: 10s
    static_configs:
      - targets: ["symptom-service:8002"]
    metrics_path: /metrics

  - job_name: "prescription-service"
    scrape_interval: 10s
    static_configs:
      - targets: ["prescription-service:8003"]
    metrics_path: /metrics

  - job_name: "notification-service"
    scrape_interval: 10s
    static_configs:
      - targets: ["notification-service:8004"]
    metrics_path: /metrics

  - job_name: "postgres"
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres:9187"]

  - job_name: "redis"
    scrape_interval: 30s
    static_configs:
      - targets: ["redis:9121"]

  - job_name: "kafka"
    scrape_interval: 15s
    static_configs:
      - targets: ["kafka:9101"]
