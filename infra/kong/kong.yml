_format_version: "3.0"
_transform: true

services:
  - name: user-service
    url: http://user-service:8001
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
      - name: patient-routes
        paths:
          - /api/v1/patients
        strip_path: false

  - name: symptom-service
    url: http://symptom-service:8002
    routes:
      - name: symptom-routes
        paths:
          - /api/v1/symptoms
        strip_path: false

  - name: prescription-service
    url: http://prescription-service:8003
    routes:
      - name: prescription-routes
        paths:
          - /api/v1/prescriptions
        strip_path: false
      - name: medication-routes
        paths:
          - /api/v1/medications
        strip_path: false

  - name: notification-service
    url: http://notification-service:8004
    routes:
      - name: notification-routes
        paths:
          - /api/v1/notifications
        strip_path: false
      - name: physician-routes
        paths:
          - /api/v1/physicians
        strip_path: false

  - name: epi-engine
    url: http://epi-engine:8005
    routes:
      - name: region-routes
        paths:
          - /api/v1/regions
        strip_path: false
      - name: map-routes
        paths:
          - /api/v1/map
        strip_path: false
      - name: control-routes
        paths:
          - /api/v1/control
        strip_path: false
      - name: simulate-routes
        paths:
          - /api/v1/simulate
        strip_path: false

plugins:
  - name: jwt
    config:
      uri_param_names:
        - jwt
      cookie_names: []
      claims_to_verify:
        - exp

  - name: rate-limiting
    config:
      minute: 100
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:5173
        - https://app.cyberepi.com
        - https://dashboard.cyberepi.com
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Request-ID
      exposed_headers:
        - X-Request-ID
      credentials: true
      max_age: 3600
