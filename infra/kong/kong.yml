_format_version: "3.0"
_transform: true

services:
  - name: user-service
    url: http://user-service:8001
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
        # credential-stuffing surface: much tighter than the global limit
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: redis
              redis_host: redis
              redis_port: 6379
              limit_by: ip
      - name: patient-routes
        paths:
          - /api/v1/patients
        strip_path: false

  - name: symptom-service
    url: http://symptom-service:8002
    routes:
      - name: symptom-routes
        paths:
          - /api/v1/symptoms
        strip_path: false
      - name: patient-history-routes
        paths:
          - "~/api/v1/patients/[^/]+/history$"
        methods:
          - GET
        regex_priority: 10
        strip_path: false

  - name: prescription-service
    url: http://prescription-service:8003
    routes:
      - name: prescription-routes
        paths:
          - /api/v1/prescriptions
        strip_path: false
      - name: medication-routes
        paths:
          - /api/v1/medications
        strip_path: false

  - name: notification-service
    url: http://notification-service:8004
    routes:
      - name: notification-routes
        paths:
          - /api/v1/notifications
        strip_path: false
      - name: physician-routes
        paths:
          - /api/v1/physicians
        strip_path: false

  - name: epi-engine
    url: http://epi-engine:8005
    routes:
      - name: region-routes
        paths:
          - /api/v1/regions
        strip_path: false
      - name: map-routes
        paths:
          - /api/v1/map
        strip_path: false
      - name: control-routes
        paths:
          - /api/v1/control
        strip_path: false
      - name: simulate-routes
        paths:
          - /api/v1/simulate
        strip_path: false

  - name: privacy-service
    url: http://privacy-service:8006
    routes:
      - name: federated-learning-routes
        paths:
          - /api/v1/fl
        strip_path: false
      # /internal/dp is deliberately not exposed through the gateway.

plugins:
  # No gateway-level jwt plugin: Kong's bundled jwt plugin authenticates
  # against Kong consumer credentials, not Keycloak RS256 token issuers,
  # and would 401 every public route (auth/register) as well. AuthN/AuthZ
  # is enforced per service via Keycloak JWKS (libs/shared auth middleware);
  # the gateway handles routing, rate limiting, metrics and CORS only.

  - name: rate-limiting
    config:
      minute: 100
      # redis policy: counters shared across Kong replicas and surviving
      # restarts, so the limit is actually global rather than per-node.
      policy: redis
      redis_host: redis
      redis_port: 6379
      fault_tolerant: true
      hide_client_headers: false

  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:5173
        - https://app.cyberepi.com
        - https://dashboard.cyberepi.com
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Request-ID
      exposed_headers:
        - X-Request-ID
      credentials: true
      max_age: 3600
