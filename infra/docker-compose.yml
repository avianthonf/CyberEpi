version: "3.9"

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *common
    image: timescale/timescaledb:latest-pg16
    container_name: cyberepi-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cyberepi
      POSTGRES_USER: cyberepi
      POSTGRES_PASSWORD: devpassword
    networks:
      - cyberepi-net

  redis:
    <<: *common
    image: redis:7-alpine
    container_name: cyberepi-redis
    ports:
      - "6379:6379"
    networks:
      - cyberepi-net

  # Kafka in Kraft mode (no Zookeeper)
  kafka:
    <<: *common
    image: confluentinc/cp-kafka:7.6.0
    container_name: cyberepi-kafka
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9093,PLAINTEXT://kafka:9092
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qo'
    networks:
      - cyberepi-net

  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:24.0
    container_name: cyberepi-keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: cyberepi
      KC_DB_PASSWORD: devpassword
    command: start-dev
    networks:
      - cyberepi-net

networks:
  cyberepi-net:
    name: cyberepi-net
