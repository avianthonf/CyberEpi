version: "3.9"

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ─────────────── DATA LAYER ───────────────
  postgres:
    <<: *common
    image: timescale/timescaledb:latest-pg16
    container_name: cyberepi-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cyberepi
      POSTGRES_USER: cyberepi
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberepi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberepi-net

  redis:
    <<: *common
    image: redis:7-alpine
    container_name: cyberepi-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberepi-net

  # ─────────────── MESSAGING ───────────────
  zookeeper:
    <<: *common
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: cyberepi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberepi-net

  kafka:
    <<: *common
    image: confluentinc/cp-kafka:7.6.0
    container_name: cyberepi-kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cyberepi-net

  schema-registry:
    <<: *common
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: cyberepi-schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberepi-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cyberepi-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for Kafka to be fully ready...' &&
        cub kafka-ready -b kafka:9092 1 60 &&
        echo 'Creating topics...' &&
        kafka-topics --create --topic patient.events --partitions 6 --replication-factor 1 --bootstrap-server kafka:9092 --if-not-exists &&
        kafka-topics --create --topic epi.updates --partitions 3 --replication-factor 1 --bootstrap-server kafka:9092 --if-not-exists &&
        kafka-topics --create --topic alerts.push --partitions 3 --replication-factor 1 --bootstrap-server kafka:9092 --if-not-exists &&
        echo 'Topics created successfully!'
      "
    networks:
      - cyberepi-net

  # ─────────────── API GATEWAY ───────────────
  kong:
    <<: *common
    image: kong:3-alpine
    container_name: cyberepi-kong
    ports:
      - "8000:8000"   # Proxy
      - "8001:8001"   # Admin API
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberepi-net

  # ─────────────── IDENTITY ───────────────
  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:24.0
    container_name: cyberepi-keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: cyberepi
      KC_DB_PASSWORD: devpassword
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 200"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - cyberepi-net

  # ─────────────── MICROSERVICES ───────────────
  user-service:
    <<: *common
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    container_name: cyberepi-user-service
    ports:
      - "8011:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://cyberepi:devpassword@postgres:5432/cyberepi
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: cyberepi
      SERVICE_PORT: 8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - cyberepi-net

  symptom-service:
    <<: *common
    build:
      context: ../services/symptom-service
      dockerfile: Dockerfile
    container_name: cyberepi-symptom-service
    ports:
      - "8012:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://cyberepi:devpassword@postgres:5432/cyberepi
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_PORT: 8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - cyberepi-net

  prescription-service:
    <<: *common
    build:
      context: ../services/prescription-service
      dockerfile: Dockerfile
    container_name: cyberepi-prescription-service
    ports:
      - "8013:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://cyberepi:devpassword@postgres:5432/cyberepi
      REDIS_URL: redis://redis:6379/0
      OPENFDA_API_URL: https://api.fda.gov
      RXNORM_API_URL: https://rxnav.nlm.nih.gov/REST
      SERVICE_PORT: 8003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cyberepi-net

  notification-service:
    <<: *common
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    container_name: cyberepi-notification-service
    ports:
      - "8014:8004"
    environment:
      DATABASE_URL: postgresql+asyncpg://cyberepi:devpassword@postgres:5432/cyberepi
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_PORT: 8004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - cyberepi-net

  # ─────────────── MONITORING ───────────────
  prometheus:
    <<: *common
    image: prom/prometheus:v2.51.0
    container_name: cyberepi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - cyberepi-net

  grafana:
    <<: *common
    image: grafana/grafana:10.4.0
    container_name: cyberepi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - cyberepi-net

  loki:
    <<: *common
    image: grafana/loki:2.9.6
    container_name: cyberepi-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - cyberepi-net

  promtail:
    <<: *common
    image: grafana/promtail:2.9.6
    container_name: cyberepi-promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - cyberepi-net

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  cyberepi-net:
    driver: bridge
    name: cyberepi-net
