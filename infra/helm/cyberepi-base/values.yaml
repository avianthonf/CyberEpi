# CyberEpi Base Infrastructure Values

global:
  namespace: cyberepi-dev

postgres:
  image: timescale/timescaledb:latest-pg16
  replicas: 1
  storage: 10Gi
  credentials:
    username: cyberepi
    password: devpassword
    database: cyberepi
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m

redis:
  image: redis:7-alpine
  replicas: 1
  storage: 1Gi
  maxMemory: 256mb
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

kafka:
  image: confluentinc/cp-kafka:7.6.0
  replicas: 1
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m
  topics:
    - name: patient.events
      partitions: 6
      replicationFactor: 1
    - name: epi.updates
      partitions: 3
      replicationFactor: 1
    - name: alerts.push
      partitions: 3
      replicationFactor: 1

zookeeper:
  image: confluentinc/cp-zookeeper:7.6.0
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

schemaRegistry:
  image: confluentinc/cp-schema-registry:7.6.0
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

kong:
  image: kong:3-alpine
  replicas: 2
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 1000m

keycloak:
  image: quay.io/keycloak/keycloak:24.0
  replicas: 1
  adminUser: admin
  adminPassword: admin
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m

monitoring:
  prometheus:
    image: prom/prometheus:v2.51.0
    retention: 30d
  grafana:
    image: grafana/grafana:10.4.0
    adminPassword: admin
  loki:
    image: grafana/loki:2.9.6
