apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cyberepi-dev
  labels:
    app: notification-service
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: cyberepi/notification-service:latest
          ports:
            - containerPort: 8004
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://cyberepi:$(DB_PASSWORD)@postgres:5432/cyberepi
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SERVICE_PORT
              value: "8004"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cyberepi-dev
spec:
  selector:
    app: notification-service
  ports:
    - port: 8004
      targetPort: 8004
