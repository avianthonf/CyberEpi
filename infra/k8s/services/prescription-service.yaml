apiVersion: apps/v1
kind: Deployment
metadata:
  name: prescription-service
  namespace: cyberepi-dev
  labels:
    app: prescription-service
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prescription-service
  template:
    metadata:
      labels:
        app: prescription-service
    spec:
      containers:
        - name: prescription-service
          image: cyberepi/prescription-service:latest
          ports:
            - containerPort: 8003
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://cyberepi:$(DB_PASSWORD)@postgres:5432/cyberepi
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: OPENFDA_API_URL
              value: https://api.fda.gov
            - name: RXNORM_API_URL
              value: https://rxnav.nlm.nih.gov/REST
            - name: SERVICE_PORT
              value: "8003"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: prescription-service
  namespace: cyberepi-dev
spec:
  selector:
    app: prescription-service
  ports:
    - port: 8003
      targetPort: 8003
