apiVersion: apps/v1
kind: Deployment
metadata:
  name: privacy-service
  namespace: cyberepi-dev
  labels:
    app: privacy-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: privacy-service
  template:
    metadata:
      labels:
        app: privacy-service
    spec:
      containers:
        - name: privacy-service
          image: cyberepi/privacy-service:latest
          ports:
            - containerPort: 8006
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://cyberepi:$(DB_PASSWORD)@postgres:5432/cyberepi
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: SERVICE_PORT
              value: "8006"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: privacy-service
  namespace: cyberepi-dev
spec:
  selector:
    app: privacy-service
  ports:
    - port: 8006
      targetPort: 8006
