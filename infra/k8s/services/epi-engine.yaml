apiVersion: apps/v1
kind: Deployment
metadata:
  name: epi-engine
  namespace: cyberepi-dev
  labels:
    app: epi-engine
    component: core
    app.kubernetes.io/part-of: cyberepi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epi-engine
  template:
    metadata:
      labels:
        app: epi-engine
        component: core
        app.kubernetes.io/part-of: cyberepi
    spec:
      containers:
      - name: epi-engine
        image: cyberepi/epi-engine:latest
        ports:
        - containerPort: 8005
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cyberepi-secrets
              key: database-url
        - name: REDIS_URL
          value: redis://redis-service:6379/0
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-service:9092
        - name: SERVICE_PORT
          value: "8005"
        - name: LOG_LEVEL
          value: INFO
        resources:
          requests:
            memory: 256Mi
            cpu: 250m
          limits:
            memory: 512Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8005
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: epi-engine
  namespace: cyberepi-dev
  labels:
    app: epi-engine
    component: core
    app.kubernetes.io/part-of: cyberepi
spec:
  selector:
    app: epi-engine
  ports:
  - name: http
    port: 8005
    targetPort: 8005
  type: ClusterIP
