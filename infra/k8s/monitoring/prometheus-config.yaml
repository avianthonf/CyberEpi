apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cyberepi-dev
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alert-rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: kong
        static_configs:
          - targets: ["kong-admin:8001"]
        metrics_path: /metrics
      - job_name: user-service
        static_configs:
          - targets: ["user-service:8001"]
        metrics_path: /metrics
      - job_name: symptom-service
        static_configs:
          - targets: ["symptom-service:8002"]
        metrics_path: /metrics
      - job_name: prescription-service
        static_configs:
          - targets: ["prescription-service:8003"]
        metrics_path: /metrics
      - job_name: notification-service
        static_configs:
          - targets: ["notification-service:8004"]
        metrics_path: /metrics
      - job_name: epi-engine
        static_configs:
          - targets: ["epi-engine:8005"]
        metrics_path: /metrics
      - job_name: privacy-service
        static_configs:
          - targets: ["privacy-service:8006"]
        metrics_path: /metrics
  alert-rules.yml: |
    groups:
      - name: service_health
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.job }} is down"
          - alert: HighErrorRate
            expr: (sum(rate(http_requests_total{status=~"5.."}[5m])) by (job) / sum(rate(http_requests_total[5m])) by (job)) > 0.01
            for: 5m
            labels:
              severity: warning
      - name: epidemiology
        rules:
          - alert: RtAbove1
            expr: cyberepi_rt_current > 1
            for: 24h
            labels:
              severity: warning
      - name: infrastructure
        rules:
          - alert: KafkaConsumerLag
            expr: kafka_consumer_group_lag > 10000
            for: 10m
            labels:
              severity: warning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cyberepi-dev
  labels:
    app: prometheus
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          ports:
            - containerPort: 9090
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=30d"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cyberepi-dev
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
