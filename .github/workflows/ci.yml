name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  forecaster:
    name: Forecaster checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy pandas scipy jsonschema pyyaml lightgbm scikit-learn ruff

      - name: Lint
        run: ruff check backtest

      - name: Every module compiles and imports
        working-directory: backtest
        run: |
          python -m py_compile *.py
          python -c "import eakf, forecast, gbqr, hub_data, live, package_submission, run_flusight, seir_fast, validate_submission, wis"

      - name: Scoring tests
        working-directory: backtest
        run: python test_scoring_accounting.py
