name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - symptom-service
          - prescription-service
          - notification-service
          - privacy-service
          - epi-engine

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: cyberepi
          POSTGRES_USER: cyberepi
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberepi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install core libraries
        run: |
          python -m pip install --upgrade pip
          pip install -e ./libs/seir-core
          pip install -e ./libs/shared

      - name: Install service dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -e ".[dev]"
          # epi-engine needs the ML extra for its deterioration tests
          if [ "${{ matrix.service }}" = "epi-engine" ] || [ "${{ matrix.service }}" = "symptom-service" ]; then
            pip install -e ".[ml]"
          fi

      - name: Initialize database
        env:
          PGHOST: localhost
          PGUSER: cyberepi
          PGPASSWORD: devpassword
          PGDATABASE: cyberepi
        run: psql -v ON_ERROR_STOP=1 -f infra/postgres-init/00-init.sql

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: postgresql+asyncpg://cyberepi:devpassword@localhost:5432/cyberepi
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: pytest --cov --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: services/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
        if: always()

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Ruff check
        run: ruff check services/ libs/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pip audit
        run: |
          pip install pip-audit
          for svc in user-service symptom-service prescription-service notification-service privacy-service epi-engine; do
            echo "Auditing $svc..."
            cd services/$svc
            pip install -e . 2>/dev/null || true
            pip-audit || true
            cd ../..
          done

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - user-service
          - symptom-service
          - prescription-service
          - notification-service
          - privacy-service
          - epi-engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: cyberepi/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
