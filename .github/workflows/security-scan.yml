name: Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 6 AM UTC
  pull_request:
    branches: [main]

jobs:
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: always()

  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, symptom-service, prescription-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          pip install pip-audit
          pip install -e .
          pip-audit --strict

  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        service: [user-service, symptom-service, prescription-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cyberepi/${{ matrix.service }}:scan services/${{ matrix.service }}

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cyberepi/${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          exit-code: 1
