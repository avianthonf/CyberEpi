# Weekly CDC FluSight forecast (2026-27 season).
#
# Runs on Wednesdays after the CDC's midday data release, with a second try
# in the evening before the 11pm ET deadline. It forecasts, packages and
# validates. It never submits to the CDC hub: that pull request is opened by
# the owner (ROADMAP.md, checkpoint B).
#
# Repository settings (Settings > Secrets and variables > Actions > Variables):
#   FORECAST_CONTRIBUTOR_NAME / _EMAIL / _AFFILIATION
#       override the contributor details below (defaults are the ones
#       registered with the hub for CyberEpi-EAKF).
#   COMMIT_FORECASTS = "false"
#       stop committing each week's files to forecasts/ on main. On by
#       default: the commits are a public, timestamped record that each
#       forecast existed before its scores did.
name: weekly-forecast

on:
  schedule:
    - cron: "30 19 * * 3"   # Wed 19:30 UTC (2:30pm EST)
    - cron: "30 1 * * 4"    # Thu 01:30 UTC (8:30pm EST Wed), retry before deadline
  workflow_dispatch:
    inputs:
      reference_date:
        description: "Saturday reference date (default: this week)"
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy pandas scipy jsonschema pyyaml lightgbm scikit-learn

      - name: Fetch FluSight hub data
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/cdcepi/FluSight-forecast-hub hub
          git -C hub sparse-checkout set target-data auxiliary-data hub-config
          # time-series.csv is large and only the backtest needs it
          rm -f hub/target-data/time-series.csv

      - name: Skip if this week is already committed
        id: done
        run: |
          ref="${{ github.event.inputs.reference_date }}"
          if [ -z "$ref" ]; then
            ref=$(TZ=America/New_York python3 -c "import datetime as d;t=d.date.today();print(t+d.timedelta(days=(5-t.weekday())%7))")
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if ls forecasts/model-output/*/"$ref"-*.csv >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Forecast for $ref already committed; nothing to do."
          fi

      - name: Forecast, package, validate
        id: run
        if: steps.done.outputs.already != 'true'
        env:
          FORECAST_CONTRIBUTOR_NAME: ${{ vars.FORECAST_CONTRIBUTOR_NAME || 'Student' }}
          FORECAST_CONTRIBUTOR_EMAIL: ${{ vars.FORECAST_CONTRIBUTOR_EMAIL || 'avianthonf@protonmail.com' }}
          FORECAST_CONTRIBUTOR_AFFILIATION: ${{ vars.FORECAST_CONTRIBUTOR_AFFILIATION || 'Independent' }}
        run: |
          set +e
          python3 backtest/live.py --hub hub --out forecasts \
            --reference-date "${{ steps.done.outputs.ref }}" --ncpus 4
          rc=$?
          set -e
          if [ $rc -eq 2 ]; then
            if [ "${{ github.event.schedule }}" = "30 1 * * 4" ]; then
              echo "::error::CDC data still not released at the evening run; this week's forecast was not made."
              exit 1
            fi
            echo "::warning::CDC data for this week is not released yet; the evening run will retry."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ $rc -eq 0 ] || exit $rc
          # Model 2 (CyberEpi-GBQR), same data and checks.
          python3 backtest/live.py --hub hub --out forecasts --kind gbqr \
            --reference-date "${{ steps.done.outputs.ref }}"
          rm -rf forecasts/_work

      - name: Upload forecast files
        if: steps.done.outputs.already != 'true' && steps.run.outputs.stale != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ steps.done.outputs.ref }}
          path: forecasts/

      - name: Commit forecast (public timestamped record)
        if: (vars.COMMIT_FORECASTS || 'true') == 'true' && steps.done.outputs.already != 'true' && steps.run.outputs.stale != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/
          git commit -m "forecast: ${{ steps.done.outputs.ref }}"
          git pull --rebase origin main
          git push origin HEAD:main

      # Opens this week's pull request to the CDC hub from the owner's fork.
      # Needs the FLUSIGHT_PR_TOKEN secret (classic token, public_repo scope,
      # owned by the fork's owner); without it this step is skipped. Runs
      # even if the forecast was committed earlier, so a failed submission is
      # retried by the evening run; skips if this week's PR already exists.
      - name: Submit to CDC FluSight hub
        if: steps.run.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.FLUSIGHT_PR_TOKEN }}
          FORK: ${{ vars.FLUSIGHT_FORK || 'avianthonf/FluSight-forecast-hub' }}
          UPSTREAM: cdcepi/FluSight-forecast-hub
          REF: ${{ steps.done.outputs.ref }}
          GIT_NAME: ${{ vars.FORECAST_CONTRIBUTOR_NAME || 'Student' }}
          GIT_EMAIL: ${{ vars.FORECAST_CONTRIBUTOR_EMAIL || 'avianthonf@protonmail.com' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::FLUSIGHT_PR_TOKEN not set; open the CDC pull request by hand (SUBMITTING.md)."
            exit 0
          fi
          branch="CyberEpi-$REF"
          owner="${FORK%%/*}"
          if [ -n "$(gh pr list --repo "$UPSTREAM" --head "$branch" --state all --json number --jq '.[].number')" ]; then
            echo "Pull request for $REF already exists; nothing to do."
            exit 0
          fi
          files=$(ls forecasts/model-output/*/"$REF"-*.csv 2>/dev/null || true)
          [ -n "$files" ] || { echo "::error::no forecast files for $REF"; exit 1; }
          gh api -X POST "repos/$FORK/merge-upstream" -f branch=main >/dev/null
          git clone -q --depth 1 --filter=blob:none \
            "https://x-access-token:${GH_TOKEN}@github.com/${FORK}" fork
          cd fork
          git checkout -q -B "$branch"
          models=""
          for f in $files; do
            m=$(basename "$(dirname "$f")")
            # Model 2 is submitted from 2026-12-05 (backtest/MODEL2_PROTOCOL.md).
            if [ "$m" = "CyberEpi-GBQR" ] && [[ "$REF" < "2026-12-05" ]]; then continue; fi
            # Already in the hub (e.g. submitted by hand): never resubmit.
            if [ -f "model-output/$m/$(basename "$f")" ]; then continue; fi
            mkdir -p "model-output/$m"
            cp "../$f" "model-output/$m/"
            [ -f "model-metadata/$m.yml" ] || cp "../forecasts/model-metadata/$m.yml" model-metadata/
            models="$models $m"
          done
          [ -n "$models" ] || { echo "Nothing new to submit for $REF."; exit 0; }
          git add model-output model-metadata
          git -c user.name="$GIT_NAME" -c user.email="$GIT_EMAIL" commit -q -m "CyberEpi forecasts for $REF:$models"
          git push -q -f origin "$branch"
          gh pr create --repo "$UPSTREAM" --base main --head "$owner:$branch" \
            --title "CyberEpi forecasts for $REF" \
            --body "Weekly forecast submission for reference date $REF:$models. Generated and validated by https://github.com/avianthonf/CyberEpi/blob/main/.github/workflows/weekly-forecast.yml"
