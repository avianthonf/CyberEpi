apiVersion: apps/v1
kind: Deployment
metadata:
  name: epi-engine
  labels:
    app: epi-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: epi-engine
  template:
    metadata:
      labels:
        app: epi-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: epi-engine
        image: cyberepi/epi-engine:latest
        ports:
        - containerPort: 8005
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 5
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: epi-engine-config
        - secretRef:
            name: epi-engine-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: epi-engine
spec:
  selector:
    app: epi-engine
  ports:
  - protocol: TCP
    port: 8005
    targetPort: 8005
  type: ClusterIP
