[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epi-engine"
version = "0.1.0"
description = "Disease Dynamics Engine Service for CyberEpi"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "aiokafka>=0.10.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.1.0",
    "celery[redis]>=5.3.6",
    "structlog>=24.1.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "prometheus-client",
    "alembic>=1.13.1",
    "h3>=3.7.6",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "cyberepi-shared>=0.1.0",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.0.0",
    "shap>=0.44.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "testcontainers[postgres,redis]>=4.0.0",
    "pytest-mock>=3.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
# Integration tests create their own PostgreSQL/Redis through Testcontainers.
# After installing .[dev] and enabling the Podman/Docker API socket, run
# `pytest -o addopts= tests` to include them alongside unit/regression tests.
addopts = "--ignore=tests/integration"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend = "../../ruff.toml"
