# Authoritative local single-host stack. See DEPLOYMENT.md.
# Always pass --env-file and use a Compose project name for resource isolation.
x-common: &common
  restart: unless-stopped
  networks:
    - cyberepi-net
  healthcheck:
    test: ["CMD", "python", "healthcheck.py"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-service-environment: &service-environment
  DATABASE_URL: postgresql+asyncpg://cyberepi:${POSTGRES_PASSWORD:?Prepare credentials and pass --env-file}@postgres:5432/cyberepi
  REDIS_URL: redis://redis:6379/0
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: cyberepi
  DEV_AUTH_MODE: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-service-dependencies: &service-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  keycloak:
    condition: service_healthy
  user-service:
    condition: service_healthy

x-event-dependencies: &event-dependencies
  <<: *service-dependencies
  kafka:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully

services:
  postgres:
    <<: *common
    image: timescale/timescaledb:latest-pg16
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: cyberepi
      POSTGRES_USER: cyberepi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Prepare credentials and pass --env-file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberepi -d cyberepi"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    <<: *common
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  zookeeper:
    <<: *common
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc 127.0.0.1 2181 | grep -q Latency"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  kafka:
    <<: *common
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    networks:
      - cyberepi-net
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -ec
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic symptom-reports --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic patient.events --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic epi.updates --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic alerts.push --partitions 3 --replication-factor 1

  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:24.0
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Prepare credentials and pass --env-file}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: cyberepi
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Prepare credentials and pass --env-file}
      KC_HOSTNAME_STRICT: "false"
      # Agroal pool validation: background validation detects stale connections
      QUARKUS_DATASOURCE_JDBC_VALIDATION_QUERY_SQL: "SELECT 1"
      QUARKUS_DATASOURCE_JDBC_BACKGROUND_VALIDATION_INTERVAL: "30S"
      QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT: "10"
    command: start-dev --import-realm
    volumes:
      - ./infra/keycloak-realms:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /realms/cyberepi HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r response <&3
          [[ "$$response" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  user-service:
    <<: *common
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    ports:
      - "127.0.0.1:${USER_SERVICE_PORT:-8001}:8001"
    environment:
      <<: *service-environment
      SERVICE_PORT: 8001
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Prepare credentials and pass --env-file}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  symptom-service:
    <<: *common
    build:
      context: .
      dockerfile: services/symptom-service/Dockerfile
    ports:
      - "127.0.0.1:${SYMPTOM_SERVICE_PORT:-8002}:8002"
    environment:
      <<: *service-environment
      SERVICE_PORT: 8002
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on: *event-dependencies

  prescription-service:
    <<: *common
    build:
      context: .
      dockerfile: services/prescription-service/Dockerfile
    ports:
      - "127.0.0.1:${PRESCRIPTION_SERVICE_PORT:-8003}:8003"
    environment:
      <<: *service-environment
      SERVICE_PORT: 8003
      OPENFDA_API_URL: ${OPENFDA_API_URL:-https://api.fda.gov/drug/label.json}
      RXNORM_API_URL: ${RXNORM_API_URL:-https://rxnav.nlm.nih.gov/REST}
    depends_on: *service-dependencies

  notification-service:
    <<: *common
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "127.0.0.1:${NOTIFICATION_SERVICE_PORT:-8004}:8004"
    environment:
      <<: *service-environment
      SERVICE_PORT: 8004
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      APNS_KEY_PATH: ${APNS_KEY_PATH:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-com.cyberepi.patient}
    depends_on: *event-dependencies

  epi-engine:
    <<: *common
    build:
      context: .
      dockerfile: services/epi-engine/Dockerfile
    ports:
      - "127.0.0.1:${EPI_ENGINE_PORT:-8005}:8005"
    environment:
      <<: *service-environment
      SERVICE_PORT: 8005
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on: *event-dependencies

  privacy-service:
    <<: *common
    build:
      context: .
      dockerfile: services/privacy-service/Dockerfile
    ports:
      - "127.0.0.1:${PRIVACY_SERVICE_PORT:-8006}:8006"
    environment:
      <<: *service-environment
      SERVICE_PORT: 8006
      MAX_PRIVACY_BUDGET: ${MAX_PRIVACY_BUDGET:-10.0}
      FL_MIN_CLIENTS: ${FL_MIN_CLIENTS:-3}
    depends_on: *service-dependencies

  kong:
    <<: *common
    image: kong:3.7
    ports:
      - "127.0.0.1:${KONG_PORT:-8000}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_ADMIN_LISTEN: "off"
      # A single local gateway worker avoids one Lua runtime per host CPU.
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./infra/kong/kong.yml:/kong/kong.yml:ro
    depends_on:
      user-service:
        condition: service_healthy
      symptom-service:
        condition: service_healthy
      prescription-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      epi-engine:
        condition: service_healthy
      privacy-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:

networks:
  cyberepi-net:
    driver: bridge
