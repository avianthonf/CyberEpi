[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "postgres"
source = "."
[services.config]
ADDON = "POSTGRES"

[[services]]
name = "redis"
source = "."
[services.config]
ADDON = "REDIS"

[[services]]
name = "user-service"
source = "./services/user-service"
[services.config]
PORT = 8001
HEALTHCHECK_PATH = "/health"

[[services]]
name = "symptom-service"
source = "./services/symptom-service"
[services.config]
PORT = 8002
HEALTHCHECK_PATH = "/health"

[[services]]
name = "prescription-service"
source = "./services/prescription-service"
[services.config]
PORT = 8003
HEALTHCHECK_PATH = "/health"

[[services]]
name = "notification-service"
source = "./services/notification-service"
[services.config]
PORT = 8004
HEALTHCHECK_PATH = "/health"

[[services]]
name = "epi-engine"
source = "./services/epi-engine"
[services.config]
PORT = 8005
HEALTHCHECK_PATH = "/health"

[[services]]
name = "privacy-service"
source = "./services/privacy-service"
[services.config]
PORT = 8006
HEALTHCHECK_PATH = "/health"
