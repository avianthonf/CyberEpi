app = "cyberepi"
primary_region = "sjc"

[build]
  dockerfile = "../services/epi-engine/Dockerfile"

[env]
  PORT = "8005"
  DATABASE_URL = "postgresql://cyberepi:${DATABASE_PASSWORD}@cyberepi-db.internal:5432/cyberepi"
  REDIS_URL = "redis://cyberepi-redis.internal:6379/0"

[[services]]
  internal_port = 8005
  protocol = "tcp"

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    interval = 10000
    timeout = 2000
    grace_period = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Database
[[mounts]]
  source = "cyberepi_db_data"
  destination = "/var/lib/postgresql/data"

# Redis
[[mounts]]
  source = "cyberepi_redis_data"
  destination = "/data"
