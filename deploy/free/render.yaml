services:
  # PostgreSQL Database
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: cyberepi
      POSTGRES_USER: cyberepi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    disks:
      - name: postgres-data
        mountPath: /var/lib/postgresql/data
        sizeGB: 1
    healthCheck:
      path: /healthz
      port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    disks:
      - name: redis-data
        mountPath: /data
        sizeGB: 0.5

  # User Service
  user-service:
    type: web
    image: cyberepi/user-service:latest
    env:
      - DATABASE_URL
      - REDIS_URL=redis://redis:6379/0
      - KEYCLOAK_URL=https://your-keycloak-render.com
      - KEYCLOAK_REALM=cyberepi
      - SERVICE_PORT=8001
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    healthCheck:
      path: /health
      port: 8001

  # Symptom Service
  symptom-service:
    type: web
    image: cyberepi/symptom-service:latest
    env:
      - DATABASE_URL
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVICE_PORT=8002
    healthCheck:
      path: /health
      port: 8002

  # Prescription Service
  prescription-service:
    type: web
    image: cyberepi/prescription-service:latest
    env:
      - DATABASE_URL
      - REDIS_URL=redis://redis:6379/0
      - OPENFDA_API_URL=https://api.fda.gov
      - RXNORM_API_URL=https://rxnav.nlm.nih.gov/REST
      - SERVICE_PORT=8003
    healthCheck:
      path: /health
      port: 8003

  # Notification Service
  notification-service:
    type: web
    image: cyberepi/notification-service:latest
    env:
      - DATABASE_URL
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVICE_PORT=8004
    healthCheck:
      path: /health
      port: 8004

  # Epi Engine (Core Service)
  epi-engine:
    type: web
    image: cyberepi/epi-engine:latest
    env:
      - DATABASE_URL
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVICE_PORT=8005
    healthCheck:
      path: /health
      port: 8005

  # Privacy Service
  privacy-service:
    type: web
    image: cyberepi/privacy-service:latest
    env:
      - DATABASE_URL
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_PORT=8006
    healthCheck:
      path: /health
      port: 8006

# Environment Variables Group
envVarGroups:
  - name: DATABASE_URL
    description: PostgreSQL connection string
  - name: POSTGRES_PASSWORD
    description: PostgreSQL password (generate a strong one)
    description: Database password
