[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberepi-shared"
version = "0.1.0"
description = "Shared scaffolding for CyberEpi microservices: config, db, auth, security, health, kafka."
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "redis>=5.0",
    "aiokafka>=0.10",
    "fastapi>=0.111",
    "sqlalchemy[asyncio]>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend = "../../ruff.toml"
