[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seir-core"
version = "0.1.0"
description = "Core epidemiological models for CyberEpi"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "prometheus-client",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["seir_core*"]

[tool.ruff]
extend = "../../ruff.toml"
